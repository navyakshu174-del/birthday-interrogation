<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLASSIFIED: Birthday Interrogation File</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-red: #ff3333;
      --accent-yellow: #ffcc00;
      --text-main: #e0e0e0;
      --text-muted: #a0a0a0;
      --font-mono: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-mono);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .dossier {
      background-color: var(--card-bg);
      border: 2px solid var(--accent-red);
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      padding: 25px;
      box-shadow: 0 0 20px rgba(255, 51, 51, 0.2);
      position: relative;
      overflow: hidden;
    }

    .stamp {
      position: absolute;
      top: 15px;
      right: -20px;
      background-color: var(--accent-red);
      color: #000;
      font-weight: bold;
      padding: 5px 30px;
      transform: rotate(15deg);
      font-size: 0.8rem;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 1.4rem;
      color: var(--accent-red);
      text-transform: uppercase;
      margin-bottom: 20px;
      border-bottom: 1px dashed var(--accent-red);
      padding-bottom: 10px;
    }

    .suspect-info {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 5px;
    }

    .mugshot {
      width: 110px;
      height: 130px;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    .mugshot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .details {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      font-size: 0.85rem;
    }

    .details p {
      line-height: 1.4;
    }

    .label {
      color: var(--accent-yellow);
      font-weight: bold;
    }

    .interrogation-box {
      margin-bottom: 20px;
    }

    .question-title {
      color: var(--accent-yellow);
      font-size: 0.95rem;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      font-size: 0.85rem;
      display: block;
      margin-bottom: 5px;
    }

    select, input, textarea {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 10px;
      font-family: var(--font-mono);
      border-radius: 4px;
      outline: none;
    }

    select:focus, input:focus, textarea:focus {
      border-color: var(--accent-red);
    }

    .btn-submit {
      background-color: var(--accent-red);
      color: #fff;
      border: none;
      width: 100%;
      padding: 12px;
      font-family: var(--font-mono);
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #ff5555;
      box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
    }
  </style>
</head>
<body>

  <div class="dossier">
    <div class="stamp">CLASSIFIED</div>
    <h1>INTERROGATION FILE #BDAY-365</h1>

    <div class="suspect-info">
      <div class="mugshot">
        <img src="cousin.jpeg" alt="Suspect Photo">
      </div>
      <div class="details">
        <p><span class="label">SUSPECT:</span> Cousin Legend</p>
        <p><span class="label">CHARGE:</span> Level 10 Coolness</p>
        <p><span class="label">STATUS:</span> Under Cross-Examination</p>
      </div>
    </div>

    <div class="interrogation-box" id="interrogationForm">
      <div class="question-title">⚠️ DETECTIVE QUESTIONING IN PROGRESS</div>

      <!-- Replace YOUR_FORM_ID with your Formspree ID -->
      <form action="https://formspree.io/f/https://formspree.io/f/myegebkj" method="POST" id="quizForm">
        <div>
          <label for="gfStatus">1. Do you have a girlfriend right now?</label>
          <select id="gfStatus" name="Girlfriend Status" required>
            <option value="" disabled selected>Select status...</option>
            <option value="Single & Living Stress-Free">No (Single & Free)</option>
            <option value="Officially Taken">Yes (In a Relationship)</option>
            <option value="Top Secret / It's Complicated">It's Classified</option>
          </select>
        </div>

        <div>
          <label for="tripsCount">2. How many trips did you do this year?</label>
          <input type="text" id="tripsCount" name="Trips Count" placeholder="e.g. 0, 5, or 'Lost count'" required>
        </div>

        <div>
          <label for="futurePlans">3. What are your future plans for the upcoming year?</label>
          <textarea id="futurePlans" name="Future Plans" rows="3" placeholder="e.g. Get rich, travel, party..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Submit Confession</button>
      </form>
    </div>
  </div>

</body>
</html>
