<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLASSIFIED: Birthday Interrogation File</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-red: #ff3333;
      --accent-yellow: #ffcc00;
      --text-main: #e0e0e0;
      --text-muted: #a0a0a0;
      --font-mono: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-mono);
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 650px;
      width: 100%;
      background: var(--card-bg);
      border: 2px solid var(--accent-red);
      padding: 25px;
      box-shadow: 0 0 15px rgba(255, 51, 51, 0.2);
      border-radius: 8px;
    }

    .header {
      border-bottom: 2px dashed var(--accent-red);
      padding-bottom: 15px;
      margin-bottom: 20px;
      text-align: center;
    }

    .header h1 {
      color: var(--accent-red);
      font-size: 1.8rem;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .stamp {
      display: inline-block;
      border: 2px solid var(--accent-yellow);
      color: var(--accent-yellow);
      padding: 3px 8px;
      font-weight: bold;
      transform: rotate(-3deg);
      margin-top: 5px;
    }

    .details {
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .label {
      color: var(--accent-yellow);
      font-weight: bold;
    }

    .interrogation-box {
      margin-top: 20px;
    }

    .question-title {
      color: var(--accent-red);
      font-weight: bold;
      margin-bottom: 15px;
      border-left: 4px solid var(--accent-red);
      padding-left: 8px;
    }

    .field-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    select, input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      background: #121212;
      border: 1px solid #444;
      color: #fff;
      font-family: var(--font-mono);
      border-radius: 4px;
    }

    select:focus, input:focus, textarea:focus {
      outline: 1px solid var(--accent-yellow);
    }

    button.submit-btn {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-red);
      color: #fff;
      border: none;
      font-family: var(--font-mono);
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
    }

    button.submit-btn:hover {
      background-color: #cc0000;
    }

    #successMessage {
      display: none;
      color: var(--accent-yellow);
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>TOP SECRET INTERROGATION</h1>
      <div class="stamp">CONFIDENTIAL DOSSIER</div>
    </div>

    <div class="details">
      <p><span class="label">SUSPECT:</span> Cousin Legend</p>
      <p><span class="label">CHARGE:</span> Level 10 Birthday Suspect</p>
      <p><span class="label">STATUS:</span> Under Direct Cross-Examination</p>
    </div>

    <div class="interrogation-box">
      <div class="question-title">⚠️ DETECTIVE QUESTIONING IN PROGRESS</div>

      <!-- Formspree Action Endpoint Fixed Below -->
      <form action="https://formspree.io/f/myegebkj" method="POST" id="quizForm">
        
        <!-- Question 1 -->
        <div class="field-group">
          <label for="gfStatus">1. What is your current Relationship Status?</label>
          <select id="gfStatus" name="Girlfriend Status" required>
            <option value="" disabled selected>Select status...</option>
            <option value="Single & Stress Free">Single & Living Stress-Free</option>
            <option value="Officially Taken">Officially Taken (Pray for her)</option>
            <option value="Top Secret / Complicated">Top Secret / It's Complicated</option>
            <option value="Talking to 5 people">Talking to 5 people simultaneously</option>
          </select>
        </div>

        <!-- Question 2 -->
        <div class="field-group">
          <label for="tripsCount">2. How many "trips" did you take this year that your parents don't know about?</label>
          <input type="text" id="tripsCount" name="Secret Trips Count" placeholder="e.g. 0 (liar), 3, or Lost Count" required>
        </div>

        <!-- Question 3 -->
        <div class="field-group">
          <label for="biggestLie">3. What is the biggest lie you told the family this past year?</label>
          <textarea id="biggestLie" name="Biggest Lie" rows="2" placeholder="Confess now or face the consequences..." required></textarea>
        </div>

        <!-- Question 4 -->
        <div class="field-group">
          <label for="screentime">4. What is your daily screen time averaging right now?</label>
          <select id="screentime" name="Screen Time" required>
            <option value="" disabled selected>Be honest...</option>
            <option value="Healthy (2-4 hrs)">2-4 hours (Healthy human)</option>
            <option value="Unhealthy (5-8 hrs)">5-8 hours (Reel addict)</option>
            <option value="Terminal (9+ hrs)">9+ hours (Touch grass immediately)</option>
          </select>
        </div>

        <!-- Question 5 -->
        <div class="field-group">
          <label for="partyTreat">5. What are you sponsoring for us on your birthday?</label>
          <input type="text" id="tripsCount" name="Birthday Treat" placeholder="e.g. Pizza party, Dinner, or Bank Bankruptcy" required>
        </div>

        <!-- Question 6 -->
        <div class="field-group">
          <label for="confession">6. Final words/confession before we release the dossier:</label>
          <textarea id="confession" name="Final Confession" rows="2" placeholder="Type your final plea here..."></textarea>
        </div>

        <button type="submit" class="submit-btn">SUBMIT CONFESSION 🚨</button>
      </form>

      <div id="successMessage">
        ✅ CONFESSION RECORDED! Redirecting dossier...
      </div>
    </div>
  </div>

  <script>
    document.getElementById('quizForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);
      const successMsg = document.getElementById('successMessage');

      fetch(form.action, {
        method: 'POST',
        body: data,
        headers: {
          'Accept': 'application/json'
        }
      }).then(response => {
        if (response.ok) {
          form.style.display = 'none';
          successMsg.style.display = 'block';
        } else {
          alert("Oops! There was an issue submitting. Make sure your Formspree endpoint is active.");
        }
      }).catch(error => {
        alert("Submission failed. Check your internet connection.");
      });
    });
  </script>

</body>
</html>
